<html lang="en">

<title>Echoes of the Monarch</title>
<link rel="icon" type="image/svg+xml" href="assets/emblem-icon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root { --void-0:#0c0a1c; --purple-1:#251741; --purple-2:#46295f; --teal:#7fd6d0; --teal-hot:#aef3ee; --lavender:#9a8fbf; --crimson-hot:#ff6177; --ink:#d9cdf2; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    font-family:'EB Garamond',Georgia,serif; color:var(--ink);
    background:radial-gradient(120% 90% at 50% 18%, var(--purple-2) 0%, var(--purple-1) 38%, var(--void-0) 80%); }
  .gate { width:min(420px,92vw); text-align:center; animation:rise .9s ease both; }
  @keyframes rise { from{opacity:0;transform:translateY(20px);} to{opacity:1;transform:none;} }
  .emblem { width:84px; height:84px; margin:0 auto 22px; display:block; filter:drop-shadow(0 8px 30px rgba(0,0,0,.6)); }
  h1 { font-family:'Cinzel',Georgia,serif; font-weight:600; font-size:clamp(22px,5vw,30px); letter-spacing:.06em; margin:0 0 6px;
    background:linear-gradient(180deg,#eef6fb,#b9d3e0 55%,#7fa6bd); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { font-family:'Cinzel',Georgia,serif; font-size:12px; letter-spacing:.3em; text-transform:uppercase; color:var(--lavender); margin:0 0 30px; }
  form { display:flex; flex-direction:column; gap:14px; }
  input { font-family:inherit; font-size:16px; text-align:center; letter-spacing:.08em; color:var(--ink);
    padding:14px 16px; border-radius:4px; border:1px solid rgba(127,214,208,.3); background:rgba(12,10,28,.5); outline:none; transition:border-color .2s, box-shadow .2s; }
  input:focus { border-color:var(--teal); box-shadow:0 0 18px rgba(127,214,208,.25); }
  button { font-family:'Cinzel',Georgia,serif; font-size:14px; letter-spacing:.18em; text-transform:uppercase; cursor:pointer;
    padding:14px; border-radius:4px; border:1px solid var(--teal); color:var(--void-0);
    background:linear-gradient(180deg,var(--teal-hot),var(--teal)); box-shadow:0 0 22px rgba(127,214,208,.3); transition:transform .2s, box-shadow .2s; }
  button:hover { transform:translateY(-2px); box-shadow:0 0 36px rgba(127,214,208,.55); }
  button:disabled { opacity:.6; cursor:wait; transform:none; }
  .err { min-height:18px; color:var(--crimson-hot); font-size:14px; letter-spacing:.04em; }
  .hint { margin-top:18px; font-size:12px; color:var(--lavender); opacity:.55; }
</style>
</head>

  <script>
  (function () {
    var P = JSON.parse(document.getElementById('payload').textContent);
    var form = document.getElementById('gateForm');
    var pw = document.getElementById('pw');
    var go = document.getElementById('go');
    var err = document.getElementById('err');
    var KEY = 'eotm-gate-pw';
    var subtle = window.crypto && window.crypto.subtle;

    if (!subtle) {
      err.textContent = 'This page needs a secure (https) context to unlock.';
      go.disabled = true;
      return;
    }

    function b2u(b64) {
      var bin = atob(b64), u = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
      return u;
    }

    function decrypt(password) {
      var penc = new TextEncoder();
      return window.crypto.subtle
        .importKey('raw', penc.encode(password), 'PBKDF2', false, ['deriveKey'])
        .then(function (base) {
          return window.crypto.subtle.deriveKey(
            { name: 'PBKDF2', salt: b2u(P.salt), iterations: P.iter, hash: 'SHA-256' },
            base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
          );
        })
        .then(function (key) {
          return window.crypto.subtle.decrypt({ name: 'AES-GCM', iv: b2u(P.iv) }, key, b2u(P.ct));
        })
        .then(function (buf) { return new TextDecoder().decode(buf); });
    }

    function reveal(html) {
      document.open();
      document.write(html);
      document.close();
    }

    function attempt(password, fromCache) {
      err.textContent = '';
      go.disabled = true;
      return decrypt(password).then(
        function (html) {
          try { sessionStorage.setItem(KEY, password); } catch (e) {}
          reveal(html);
        },
        function () {
          go.disabled = false;
          if (!fromCache) {
            err.textContent = 'The gate does not open to that word.';
            pw.value = '';
            pw.focus();
          }
        }
      );
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (pw.value) attempt(pw.value, false);
    });

    // Already unlocked this session? Slip straight in.
    try {
      var cached = sessionStorage.getItem(KEY);
      if (cached) attempt(cached, true);
    } catch (e) {}
  })();
  </script>
