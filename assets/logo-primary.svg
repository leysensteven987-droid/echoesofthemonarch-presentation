<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Echoes of the Monarch">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&amp;display=swap');
      .display { font-family: 'Cinzel', Georgia, 'Times New Roman', serif; }
    </style>
    <radialGradient id="bg" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#4a2c66"/><stop offset="42%" stop-color="#2a1b47"/><stop offset="100%" stop-color="#0d0a1f"/>
    </radialGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef6fb"/><stop offset="55%" stop-color="#b9d3e0"/><stop offset="100%" stop-color="#7fa6bd"/>
    </linearGradient>
    <filter id="halo" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="hot" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4.5"/></filter>
    <filter id="blurText" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <g fill="#e0455f">
    <circle cx="430" cy="180" r="2.2" opacity="0.30"/><circle cx="1180" cy="150" r="1.8" opacity="0.25"/>
    <circle cx="540" cy="250" r="2.0" opacity="0.22"/><circle cx="1080" cy="280" r="1.8" opacity="0.20"/>
    <circle cx="700" cy="140" r="1.5" opacity="0.18"/>
  </g>

  <!-- EMBLEM: the crimson diamond -->
  <g>
    <path d="M800 134 L930 292 L800 450 L670 292 Z" fill="none" stroke="#e0455f" stroke-width="30" opacity="0.5" filter="url(#halo)"/>
    <path d="M800 134 L930 292 L800 450 L670 292 Z" fill="none" stroke="#ff6177" stroke-width="8" opacity="0.85" filter="url(#hot)"/>
    <path d="M800 134 L930 292 L800 450 L670 292 Z" fill="none" stroke="#e0455f" stroke-width="10" stroke-linejoin="round"/>
  </g>

  <!-- WORDMARK -->
  <g opacity="0.95">
    <line x1="556" y1="470" x2="650" y2="470" stroke="#e0455f" stroke-width="1.5" opacity="0.8"/>
    <path d="M 668 470 L 676 462 L 684 470 L 676 478 Z" fill="#ff6177"/>
    <text x="800" y="481" text-anchor="middle" class="display" font-weight="600" font-size="34" letter-spacing="17" fill="#8fd3cd">ECHOES OF THE</text>
    <path d="M 924 470 L 932 462 L 940 470 L 932 478 Z" fill="#ff6177"/>
    <line x1="950" y1="470" x2="1044" y2="470" stroke="#e0455f" stroke-width="1.5" opacity="0.8"/>
  </g>
  <text x="800" y="618" text-anchor="middle" class="display" font-weight="700" font-size="128" letter-spacing="8" fill="#2f8f88" opacity="0.7" filter="url(#blurText)">MONARCH</text>
  <text x="800" y="618" text-anchor="middle" class="display" font-weight="700" font-size="128" letter-spacing="8" fill="url(#silver)">MONARCH</text>
  <text x="800" y="690" text-anchor="middle" class="display" font-weight="500" font-size="19" letter-spacing="7" fill="#9a8fbf" opacity="0.85">EVERY SHADOW REMEMBERS ITS KING</text>
</svg>
